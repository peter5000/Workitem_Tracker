<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workitem Tracker — Focused Personal Kanban</title>
  <meta name="description" content="A focused personal work item tracker with strict WIP limits, scoped Definitions of Done, and built-in time tracking.">
  <meta name="theme-color" content="#0b1020">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%238b7cf6'/%3E%3Cstop offset='1' stop-color='%235eb6f8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='7' y='7' width='18' height='18' rx='5' transform='rotate(45 16 16)' fill='url(%23g)'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
  <link rel="stylesheet" href="/css/styles.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar__brand">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
        <defs>
          <linearGradient id="logo-g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#8b7cf6"/><stop offset="1" stop-color="#5eb6f8"/>
          </linearGradient>
        </defs>
        <rect x="7" y="7" width="18" height="18" rx="5" transform="rotate(45 16 16)" fill="url(#logo-g)"/>
        <rect x="12" y="12" width="8" height="8" rx="2" transform="rotate(45 16 16)" fill="#0b1020" opacity=".55"/>
      </svg>
      <h1 class="topbar__title">Workitem Tracker</h1>
    </div>

    <nav class="tabs" aria-label="Views">
      <a href="#/board" class="tab" id="nav-board" data-view="board">Board</a>
      <a href="#/someday" class="tab" id="nav-someday" data-view="someday">Someday <span class="tab__count" id="someday-count"></span></a>
      <a href="#/archive" class="tab" id="nav-archive" data-view="archive">Archive</a>
    </nav>

    <div class="topbar__right">
      <div class="running" id="running-indicator" hidden></div>
      <div class="weekstat" id="week-stats"></div>
      <span class="save-status" id="save-status" aria-live="polite"></span>
    </div>
  </header>

  <div class="filterbar" id="filter-bar" hidden></div>

  <main id="view" class="view">
    <div class="loading" aria-live="polite"><span class="loading__spinner"></span>Loading your board…</div>
  </main>

  <div id="modal-root"></div>
  <div id="toast-root" class="toasts" aria-live="polite"></div>
</body>
</html>
